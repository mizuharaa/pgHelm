services:
  postgres:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_USER: pghelm
      POSTGRES_PASSWORD: pghelm_local_only
      POSTGRES_DB: pghelm
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pghelm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pghelm -d pghelm"]
      interval: 2s
      timeout: 3s
      retries: 30
    command: ["postgres", "-c", "fsync=on", "-c", "synchronous_commit=on", "-c", "full_page_writes=on"]
volumes:
  pghelm_data:
